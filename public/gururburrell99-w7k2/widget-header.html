<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Outfit:wght@700;800;900&family=Saira+Condensed:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#6B21A8;--purple-hi:#A855F7;--purple-lo:#3B0764;
  --green:#00FF88;--green-lo:#00CC66;--green-dim:#004D33;
  --orange:#F97316;--orange-hi:#FB923C;
  --ink:#030712;--ink-2:#0B0F1A;--ink-3:#111827;
  --text:#F0F4FF;--text-dim:#C4B5FD;--text-muted:#6D5A8A;
  --tiktok-pink:#FE2C55;
  --panel:rgba(11,15,26,.93);--panel-line:rgba(107,33,168,.5);
  --font-display:"Anton",sans-serif;--font-cond:"Saira Condensed",sans-serif;--font-body:"Outfit",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1080px;height:160px;background:transparent;overflow:hidden;font-family:var(--font-body);}
.header{width:1080px;height:160px;padding:18px 32px;display:flex;align-items:center;gap:20px;
  background:linear-gradient(180deg,rgba(3,7,18,.97) 0%,rgba(11,15,26,.82) 100%);
  position:relative;overflow:hidden;}
/* UFO beam bottom line */
.header::after{content:"";position:absolute;bottom:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,transparent,var(--purple-lo) 20%,var(--purple-hi) 40%,var(--green) 60%,var(--purple-hi) 80%,transparent);
  box-shadow:0 0 18px rgba(0,255,136,.7),0 0 36px rgba(168,85,247,.4);}
.header::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(168,85,247,.3),transparent);}
/* Star field bg */
.stars{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 20% 50%,rgba(0,255,136,.05) 0%,transparent 40%),
    radial-gradient(ellipse at 80% 50%,rgba(168,85,247,.06) 0%,transparent 40%);}

.avatar{position:relative;flex:none;}
.avatar-ring{width:112px;height:112px;border-radius:50%;padding:3px;
  background:conic-gradient(var(--purple-lo),var(--purple-hi),var(--green),var(--orange),var(--purple-hi),var(--purple-lo));
  box-shadow:0 0 26px rgba(0,255,136,.6),0 0 50px rgba(168,85,247,.3);
  animation:ring-spin 4s linear infinite;}
@keyframes ring-spin{to{filter:hue-rotate(30deg);}}
.avatar-ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 15%;}
.avatar .badge{position:absolute;right:-4px;bottom:-4px;width:30px;height:30px;border-radius:50%;
  background:linear-gradient(135deg,var(--purple-lo),var(--green-dim));
  border:3px solid var(--ink-2);display:flex;align-items:center;justify-content:center;
  font-size:14px;box-shadow:0 0 10px rgba(0,255,136,.5);}

.id{flex:1;min-width:0;}
.wordmark{font-family:var(--font-display);font-size:44px;line-height:.9;transform:skewX(-4deg);
  color:var(--text);text-shadow:0 0 30px rgba(168,85,247,.6),0 3px 0 rgba(0,0,0,.9);}
.wordmark .accent{color:var(--purple-hi);text-shadow:0 0 20px rgba(168,85,247,.9);}
.wordmark .accent2{color:var(--green);text-shadow:0 0 20px rgba(0,255,136,.8);}
.submeta{display:flex;align-items:center;gap:10px;margin-top:8px;}
.submeta .handle{font-size:18px;font-weight:600;color:var(--text-dim);}
.submeta .sep{width:4px;height:4px;border-radius:50%;background:var(--green);}
.submeta .game{font-size:16px;font-weight:600;color:var(--text-muted);}

.header-right{display:flex;flex-direction:column;align-items:flex-end;gap:10px;flex:none;}
.live-pill{display:flex;align-items:center;gap:8px;background:var(--tiktok-pink);color:#fff;
  font-family:var(--font-body);font-weight:800;font-size:19px;letter-spacing:2px;
  padding:8px 17px 8px 12px;border-radius:8px;box-shadow:0 0 18px rgba(254,44,85,.5);
  animation:livepulse 2s ease-out infinite;}
.live-dot{width:10px;height:10px;border-radius:50%;background:#fff;animation:blink 1.1s infinite;}
.viewers{display:flex;align-items:center;gap:8px;background:rgba(11,15,26,.8);
  border:1.5px solid rgba(0,255,136,.35);color:var(--text);font-weight:700;font-size:18px;
  padding:7px 14px;border-radius:8px;}
@keyframes blink{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.3;transform:scale(.7);}}
@keyframes livepulse{0%{box-shadow:0 0 0 0 rgba(254,44,85,.6);}70%{box-shadow:0 0 0 12px rgba(254,44,85,0);}100%{box-shadow:0 0 0 0 rgba(254,44,85,0);}}
</style>
</head>
<body>
<div class="header">
  <div class="stars"></div>
  <div class="avatar">
    <div class="avatar-ring"><img src="avatar.jpg" alt="GuRuBurrell99"></div>
    <div class="badge">👽</div>
  </div>
  <div class="id">
    <div class="wordmark">GuRu<span class="accent">Burrell</span><span class="accent2">99</span></div>
    <div class="submeta">
      <span class="handle">@gururburrell99</span>
      <span class="sep"></span>
      <span class="game">TikTok Live · Fortnite · 👽 Alien Vibes</span>
    </div>
  </div>
  <div class="header-right">
    <div class="live-pill"><div class="live-dot"></div>LIVE</div>
    <div class="viewers">👁 <span id="viewers">--</span></div>
  </div>
</div>
<script>
const SESSION="gururburrell99-w7k2";
function connectSSE(){
  const es=new EventSource("/events/"+SESSION);
  es.onmessage=e=>{const d=JSON.parse(e.data);if(d.type==="status"&&d.viewerCount)document.getElementById("viewers").textContent=d.viewerCount.toLocaleString();};
  es.onerror=()=>{es.close();setTimeout(connectSSE,3000);};
}
connectSSE();
async function poll(){try{const r=await fetch("/api/"+SESSION+"/status");const d=await r.json();if(d.viewerCount)document.getElementById("viewers").textContent=d.viewerCount.toLocaleString();}catch(e){}}
poll();setInterval(poll,10000);
</script>
</body>
</html>
